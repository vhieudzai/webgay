<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Protein Obfuscator - ColorOS Edition</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: system-ui, -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
        }

        body {
            background: linear-gradient(135deg, #0d0f18 0%, #16192b 100%);
            color: #f8fafc;
            display: flex;
            flex-direction: column;
            min-height: 100vh;
            overflow-x: hidden;
        }

        /* Header phong cách kính mờ ColorOS */
        header {
            background: rgba(24, 27, 40, 0.75);
            backdrop-filter: blur(16px);
            -webkit-backdrop-filter: blur(16px);
            padding: 20px;
            text-align: center;
            border-bottom: 1px solid rgba(255, 255, 255, 0.08);
            position: sticky;
            top: 0;
            z-index: 10;
        }

        header h1 {
            background: linear-gradient(135deg, #c084fc, #ec4899);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            font-size: 22px;
            font-weight: 700;
            letter-spacing: 0.5px;
        }

        /* Layout Container */
        .container {
            display: flex;
            flex: 1;
            padding: 24px;
            gap: 20px;
            max-width: 1400px;
            margin: 0 auto;
            width: 100%;
        }

        @media (max-width: 900px) {
            .container {
                flex-direction: column;
            }
        }

        /* Khung kính mờ cho các thành phần (Glassmorphism) */
        .editor-pane, .control-panel {
            background: rgba(24, 27, 40, 0.6);
            backdrop-filter: blur(20px);
            -webkit-backdrop-filter: blur(20px);
            border: 1px solid rgba(255, 255, 255, 0.08);
            border-radius: 20px;
            padding: 20px;
            box-shadow: 0 8px 32px 0 rgba(0, 0, 0, 0.37);
        }

        .editor-pane {
            flex: 1;
            display: flex;
            flex-direction: column;
        }

        .editor-pane label, .control-group label, .control-panel h3 {
            font-weight: 600;
            margin-bottom: 10px;
            color: #cbd5e1;
            font-size: 14px;
        }

        .control-panel h3 {
            font-size: 16px;
            color: #f1f5f9;
            border-bottom: 1px solid rgba(255, 255, 255, 0.08);
            padding-bottom: 8px;
            margin-bottom: 15px;
        }

        /* Textarea bo tròn mượt mà */
        textarea {
            flex: 1;
            background: rgba(11, 13, 20, 0.7);
            color: #e2e8f0;
            border: 1px solid rgba(255, 255, 255, 0.06);
            border-radius: 14px;
            padding: 14px;
            font-family: 'Fira Code', 'Courier New', Courier, monospace;
            font-size: 13px;
            resize: none;
            outline: none;
            min-height: 380px;
            transition: all 0.3s ease;
        }

        textarea:focus {
            border-color: #a855f7;
            box-shadow: 0 0 0 3px rgba(168, 85, 247, 0.15);
        }

        .control-panel {
            width: 320px;
            display: flex;
            flex-direction: column;
            gap: 16px;
        }

        .control-group {
            display: flex;
            flex-direction: column;
            gap: 6px;
        }

        /* Input, Select và Button kiểu bo góc đậm chất ColorOS */
        select, button {
            padding: 12px 14px;
            border-radius: 12px;
            border: 1px solid rgba(255, 255, 255, 0.08);
            background: rgba(15, 23, 42, 0.8);
            color: #ffffff;
            font-size: 14px;
            outline: none;
            cursor: pointer;
            transition: all 0.25s ease;
        }

        select:focus {
            border-color: #a855f7;
            box-shadow: 0 0 0 3px rgba(168, 85, 247, 0.15);
        }

        /* Nút bấm gradient nổi bật */
        .btn-obfuscate {
            background: linear-gradient(135deg, #9333ea, #c084fc);
            color: white;
            font-weight: 600;
            border: none;
            box-shadow: 0 4px 15px rgba(147, 51, 234, 0.3);
            margin-top: 5px;
        }

        .btn-obfuscate:hover {
            opacity: 0.9;
            transform: translateY(-1px);
            box-shadow: 0 6px 20px rgba(147, 51, 234, 0.4);
        }

        .btn-copy {
            background: rgba(51, 65, 85, 0.6);
            border: 1px solid rgba(255, 255, 255, 0.08);
            font-weight: 500;
        }

        .btn-copy:hover {
            background: rgba(71, 85, 105, 0.8);
        }
    </style>
</head>
<body>

    <header>
        <h1>PROTEIN OBFUSCATOR</h1>
    </header>

    <div class="container">
        <!-- Input Code -->
        <div class="editor-pane">
            <label for="inputCode">Source Code Gốc (Lua/Luau)</label>
            <textarea id="inputCode" placeholder="-- Dán script của ông vào đây...&#10;print('Protein Obfuscator - ColorOS Style')"></textarea>
        </div>

        <!-- Options Panel -->
        <div class="control-panel">
            <h3>Cài Đặt Bảo Mật</h3>
            
            <div class="control-group">
                <label>Mức độ Obfuscate</label>
                <select id="level">
                    <option value="low">Cơ bản (Low)</option>
                    <option value="medium" selected>Trung bình (Medium)</option>
                    <option value="high">Cực mạnh (High / Heavy)</option>
                </select>
            </div>

            <div class="control-group">
                <label>Mã hóa chuỗi (String Encrypt)</label>
                <select id="stringEnc">
                    <option value="true">Bật (Khuyên dùng)</option>
                    <option value="false">Tắt</option>
                </select>
            </div>

            <button class="btn-obfuscate" onclick="startObfuscate()">Tiến Hành Obfuscate</button>
            <button class="btn-copy" onclick="copyCode()">Copy Code Đã Mã Hóa</button>
        </div>

        <!-- Output Code -->
        <div class="editor-pane">
            <label for="outputCode">Mã Nguồn Đã Mã Hóa (Protected Output)</label>
            <textarea id="outputCode" readonly placeholder="-- Code sau khi obf sẽ hiện ở đây..."></textarea>
        </div>
    </div>

    <script>
        function startObfuscate() {
            const code = document.getElementById('inputCode').value;
            if (!code.trim()) {
                alert("Vui lòng nhập source code trước!");
                return;
            }

            const randomID = Math.random().toString(36).substring(7);
            const obfuscated = `-- [ PROTECTED BY PROTEIN OBFUSCATOR ]\n-- ID: ${randomID}\n\nlocal _1v = {\\${code.split('').map(c => c.charCodeAt(0)).join(',')}\\};\nlocal function _2v(t)\n    local s = "";\n    for _, v in ipairs(t) do s = s .. string.char(v) end;\n    return loadstring(s)();\nend;\n_2v(_1v);`;

            document.getElementById('outputCode').value = obfuscated;
        }

        function copyCode() {
            const output = document.getElementById('outputCode');
            if (!output.value) {
                alert("Chưa có code để copy!");
                return;
            }
            output.select();
            navigator.clipboard.writeText(output.value);
            alert("Đã copy code vào clipboard!");
        }
    </script>
</body>
</html>
